name: Agent Scanner

# Mon–Fri IST coverage. GitHub crons are best-effort and often late, so a scheduled
# start does not trust its cron id: session_plan.py picks the open window from the
# clock. Each segment then dispatches the next one (workflow_dispatch), and
# watchdog.yml restarts the chain if a start is missed.
#
# Segments (job cap is ~6h, so the day is chained, not one job):
#   08:55–12:32  equities + commodities
#   12:32–15:32  equities + commodities (NSE close)
#   15:32–19:47  commodities only
#   19:47–23:32  commodities only (MCX evening → ~23:30)
#   23:32–23:55  EOD Telegram summary (also cron 23:40; state.json eod_sent dedupes)
#
# Manual: single scan, test_mode, eod_summary, or loop_until (e.g. 15:32 / 23:32).
# Tick auto_session to start the chain from the current IST window.
on:
  schedule:
    - cron: "30 3 * * 1-5"    # 09:00 IST backup start
    - cron: "50 6 * * 1-5"    # 12:20 IST backup handoff
    - cron: "20 10 * * 1-5"   # 15:50 IST backup handoff
    - cron: "20 14 * * 1-5"   # 19:50 IST backup handoff
    - cron: "10 18 * * 1-5"   # 23:40 IST EOD backup
  workflow_dispatch:
    inputs:
      test_mode:
        description: "Only send a Telegram test message"
        type: boolean
        default: false
      force_run:
        description: "Ignore the market-hours guard (and re-send EOD if already posted)"
        type: boolean
        default: false
      eod_summary:
        description: "Only run the EOD Telegram summary: true = full (NSE + MCX), nse = NSE equities/indices only"
        type: choice
        options: ["false", "true", "nse"]
        default: "false"
      eod_dry_run:
        description: "Format EOD summary but do not send Telegram (use with eod_summary)"
        type: boolean
        default: false
      loop_until:
        description: "Optional: keep scanning every 5 min until this IST time, e.g. 15:32 or 23:32 (blank = one scan)"
        required: false
      commodities_only:
        description: "Scan only commodities.txt (MCX evening / manual evening loops)"
        type: boolean
        default: false
      auto_session:
        description: "Pick the open IST window and chain the next segment (watchdog / recovery)"
        type: boolean
        default: false
      base_min:
        description: "Chart timeframe in minutes (blank = 5)"
        required: false
      htf_min:
        description: "Confirmation timeframe in minutes (blank = 15)"
        required: false
      fresh_min:
        description: "Ignore signals older than this many minutes (blank = code default 60)"
        required: false
      entry_after:
        description: "Only alert entries at/after this IST HH:MM today, e.g. 12:50 (blank = all today)"
        required: false
permissions:
  contents: write
  actions: write

concurrency:
  # NSE-only EOD (eod_summary=nse) runs in its own lane so it is not stuck behind the
  # long MCX evening loop; it does not commit state.json (see save step).
  group: ${{ inputs.eod_summary == 'nse' && 'agent-scanner-eod-nse' || 'agent-scanner' }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner / EOD
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_TOKEN_2: ${{ secrets.TELEGRAM_BOT_TOKEN_2 }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_2: ${{ secrets.TELEGRAM_CHAT_ID_2 }}
          TEST_MODE: ${{ inputs.test_mode }}
          FORCE_RUN: ${{ inputs.force_run }}
          EOD_SUMMARY: ${{ inputs.eod_summary }}
          EOD_SCOPE: ${{ inputs.eod_summary == 'nse' && 'nse' || 'all' }}
          EOD_DRY_RUN: ${{ inputs.eod_dry_run }}
          BASE_MIN: ${{ inputs.base_min }}
          HTF_MIN: ${{ inputs.htf_min }}
          FRESH_MIN: ${{ inputs.fresh_min }}
          ENTRY_AFTER: ${{ inputs.entry_after }}
          HEARTBEAT: "true"
          INCLUDE_COMMODITIES: "true"
          MANUAL_LOOP_UNTIL: ${{ inputs.loop_until }}
          MANUAL_COMMODITIES_ONLY: ${{ inputs.commodities_only }}
          # schedule, or a watchdog/chain dispatch: choose the window from the clock
          AUTO_SESSION: ${{ github.event_name == 'schedule' && 'true' || inputs.auto_session }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
          # ---- optional tuning (uncomment to change) ----
          # CAPITAL: "100000"       # used for the quantity shown in alerts + EOD PnL
          # RISK_PCT: "1.0"
          # RR1: "1.2"              # sole target RR (full size to TP1; no TP2)
          # MAX_AGE: "2"            # for 5m confluence: HTF flip age ≤ this many 15m candles (0 = any)
          # HTF_TRIGGER: "false"    # default OFF — only 5m RF flip when 15m already aligned; set "true" to also alert on 15m flip
          # ONE_TRADE_DAY: "false"  # default: no daily limit
          # EOD_EXIT: "false"       # default: no square-off, trades run until SL / TP1
          # INCLUDE_COMMODITIES: "true"  # also scan commodities.txt (Yahoo futures proxies)
          # SESSION_START / SESSION_END auto-widen when futures are loaded; or set:
          # SESSION_START: "09:00"
          # SESSION_END: "23:30"
          # FRESH_MIN: "30"         # ignore signals older than this many minutes
          # COMMISSION: "0.03"      # % per side (EOD / backtest fill model)
          # SLIPPAGE_TICKS: "1"
        run: |
          set -e
          if [ "$TEST_MODE" = "true" ]; then
            python scanner.py
            exit 0
          fi
          if [ "$EOD_SUMMARY" = "true" ] || [ "$EOD_SUMMARY" = "nse" ]; then
            python eod_summary.py
            exit 0
          fi
          # Manual loop_until is a one-shot (no chain) unless auto_session is set.
          if [ "$AUTO_SESSION" != "true" ] && [ -n "$MANUAL_LOOP_UNTIL" ]; then
            export LOOP_UNTIL="$MANUAL_LOOP_UNTIL"
            export COMMODITIES_ONLY="$MANUAL_COMMODITIES_ONLY"
            python loop.py
            exit 0
          fi
          if [ "$AUTO_SESSION" != "true" ]; then
            export COMMODITIES_ONLY="$MANUAL_COMMODITIES_ONLY"
            python scanner.py
            exit 0
          fi
          python session_plan.py --write .session_plan.env
          set -a
          # shellcheck disable=SC1091
          . ./.session_plan.env
          set +a
          echo "auto session: MODE=$MODE LOOP_UNTIL=${LOOP_UNTIL:-} COMMODITIES_ONLY=$COMMODITIES_ONLY CHAIN_NEXT=$CHAIN_NEXT"
          if [ "$MODE" = "loop" ]; then
            python loop.py
          elif [ "$MODE" = "eod" ]; then
            python eod_summary.py
          else
            echo "outside market session, nothing to do"
          fi

      - name: Chain next session
        if: always() && inputs.eod_summary != 'nse' && inputs.test_mode != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f .session_plan.env ]; then
            echo "no session plan (manual / test / eod input) — not chaining"
            exit 0
          fi
          # shellcheck disable=SC1091
          . ./.session_plan.env
          if [ "$CHAIN_NEXT" != "true" ]; then
            echo "chain not requested (MODE=${MODE:-})"
            exit 0
          fi
          echo "dispatching next session"
          gh workflow run scanner.yml --ref "${GITHUB_REF_NAME}" -f auto_session=true

      - name: Save de-duplication state
        if: always() && inputs.eod_summary != 'nse'
        run: |
          git config user.name "agent-scanner-bot"
          git config user.email "agent-scanner-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "scanner state" && git pull --rebase --autostash && git push)
