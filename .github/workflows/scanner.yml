name: Agent Scanner

# Scheduled sessions (Mon–Fri, times IST = UTC+5:30):
#   09:00 → loop until 12:32   equities + commodities
#   12:20 → loop until 15:32   equities + commodities (NSE close)
#   15:50 → loop until 19:47   commodities only (MCX evening, part 1)
#   19:50 → loop until 23:32   commodities only (MCX evening, part 2 → ~23:30)
#   23:40                      EOD Telegram summary (after MCX evening)
#
# Why split evening: GitHub Actions jobs cap ~6h (timeout-minutes: 355). One loop from
# equity open through 23:30 would exceed that; two post-close commodities-only jobs stay reliable.
# Long-running loop.py (scan ~25s after each 5m close) is far more reliable than a "*/5" cron.
# Afternoon loop does not post EOD when session_end is 23:30 (commodities); EOD cron + end of
# the last evening loop do (state.json "eod_sent" dedupes).
# Manual: single scan, test_mode, eod_summary, or set loop_until (e.g. 23:32) for a live loop.
on:
  schedule:
    - cron: "30 3 * * 1-5"
    - cron: "50 6 * * 1-5"
    - cron: "20 10 * * 1-5"
    - cron: "20 14 * * 1-5"
    - cron: "10 18 * * 1-5"
  workflow_dispatch:
    inputs:
      test_mode:
        description: "Only send a Telegram test message"
        type: boolean
        default: false
      force_run:
        description: "Ignore the market-hours guard (and re-send EOD if already posted)"
        type: boolean
        default: false
      eod_summary:
        description: "Only run the end-of-day Telegram summary (today's signals / win rate / PnL)"
        type: boolean
        default: false
      eod_dry_run:
        description: "Format EOD summary but do not send Telegram (use with eod_summary)"
        type: boolean
        default: false
      loop_until:
        description: "Optional: keep scanning every 5 min until this IST time, e.g. 15:32 or 23:32 (blank = one scan)"
        required: false
      commodities_only:
        description: "Scan only commodities.txt (MCX evening / manual evening loops)"
        type: boolean
        default: false
      base_min:
        description: "Chart timeframe in minutes (blank = 5)"
        required: false
      htf_min:
        description: "Confirmation timeframe in minutes (blank = 15)"
        required: false
      fresh_min:
        description: "Ignore signals older than this many minutes (blank = code default 60)"
        required: false
      entry_after:
        description: "Only alert entries at/after this IST HH:MM today, e.g. 12:50 (blank = all today)"
        required: false
permissions:
  contents: write

concurrency:
  group: agent-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner / EOD
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_MODE: ${{ inputs.test_mode }}
          FORCE_RUN: ${{ inputs.force_run }}
          EOD_SUMMARY: ${{ inputs.eod_summary }}
          EOD_DRY_RUN: ${{ inputs.eod_dry_run }}
          BASE_MIN: ${{ inputs.base_min }}
          HTF_MIN: ${{ inputs.htf_min }}
          FRESH_MIN: ${{ inputs.fresh_min }}
          ENTRY_AFTER: ${{ inputs.entry_after }}
          HEARTBEAT: "true"
          INCLUDE_COMMODITIES: "true"
          # Evening crons (and manual commodities_only) skip the 210-symbol equity list
          COMMODITIES_ONLY: ${{ (github.event_name == 'schedule' && (github.event.schedule == '20 10 * * 1-5' || github.event.schedule == '20 14 * * 1-5')) && 'true' || (inputs.commodities_only == true && 'true' || 'false') }}
          # Morning 12:32 | afternoon 15:32 | evening A 19:47 | evening B 23:32 | EOD cron empty
          LOOP_UNTIL: ${{ github.event_name == 'schedule' && (github.event.schedule == '30 3 * * 1-5' && '12:32' || github.event.schedule == '50 6 * * 1-5' && '15:32' || github.event.schedule == '20 10 * * 1-5' && '19:47' || github.event.schedule == '20 14 * * 1-5' && '23:32' || '') || inputs.loop_until }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
          # ---- optional tuning (uncomment to change) ----
          # CAPITAL: "100000"       # used for the quantity shown in alerts + EOD PnL
          # RISK_PCT: "1.0"
          # RR1: "1.2"              # sole target RR (full size to TP1; no TP2)
          # MAX_AGE: "2"            # for 5m confluence: HTF flip age ≤ this many 15m candles (0 = any)
          # HTF_TRIGGER: "false"    # default OFF — only 5m RF flip when 15m already aligned; set "true" to also alert on 15m flip
          # ONE_TRADE_DAY: "false"  # default: no daily limit
          # EOD_EXIT: "false"       # default: no square-off, trades run until SL / TP1
          # INCLUDE_COMMODITIES: "true"  # also scan commodities.txt (Yahoo futures proxies)
          # SESSION_START / SESSION_END auto-widen when futures are loaded; or set:
          # SESSION_START: "09:00"
          # SESSION_END: "23:30"
          # FRESH_MIN: "30"         # ignore signals older than this many minutes
          # COMMISSION: "0.03"      # % per side (EOD / backtest fill model)
          # SLIPPAGE_TICKS: "1"
        run: |
          set -e
          # Daily EOD: scheduled cron 10 18 * * 1-5 (~23:40 IST, after MCX) or manual eod_summary
          if [ "$SCHEDULE_CRON" = "10 18 * * 1-5" ] || [ "$EOD_SUMMARY" = "true" ]; then
            python eod_summary.py
          elif [ -n "$LOOP_UNTIL" ]; then
            python loop.py
          else
            python scanner.py
          fi

      - name: Save de-duplication state
        if: always()
        run: |
          git config user.name "agent-scanner-bot"
          git config user.email "agent-scanner-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "scanner state" && git pull --rebase --autostash && git push)
